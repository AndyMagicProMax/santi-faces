<style>
/* ============================================================
   视觉样式（一般不用改，想换颜色就改下面 :root 里的色值）
   ============================================================ */
:root{
  --bg:#070a0f;
  --panel:rgba(16,22,29,.72);
  --panel-2:rgba(21,28,36,.72);
  --line:#1f2a33;
  --text:#d8dee3;
  --text-dim:#8a97a1;
  --face:#8fc4d4;        /* 面壁者：冷青 */
  --breaker:#c46a5a;      /* 破壁人：暗红 */
  --gold:#c9b98a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
html{background:#070a0f}
body{
  position:relative;z-index:0;      /* 让下面的背景层叠在自己的底色之上 */
  color:var(--text);
  font-family:"Noto Sans SC",system-ui,sans-serif;
  line-height:1.9;
  min-height:100vh;
  background-color:#070a0f;
}
/* 背景图与压暗蒙版都固定在视口上，铺满整屏：
   这样无论页面多长、滚到哪里、窗口多大，蒙版都完整覆盖，不会出现横向明暗接缝 */
body::before{
  content:"";position:fixed;left:0;top:0;right:0;bottom:0;z-index:-3;pointer-events:none;
  background:url("assets/background.webp") center center / cover no-repeat;
}
body::after{
  content:"";position:fixed;left:0;top:0;right:0;bottom:0;z-index:-2;pointer-events:none;
  background:linear-gradient(180deg,rgba(7,10,15,.60) 0%,rgba(7,10,15,.72) 55%,rgba(7,10,15,.80) 100%);
}
#app{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:40px 20px 80px}

/* 卡片面板半透明毛玻璃，让背景图透出 */
.role-card,.archive-card,details,.choice-btn{
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

/* 通用元素 */
h1,h2,h3{font-family:"Noto Serif SC",serif;font-weight:700}
.btn{
  display:inline-block;padding:12px 28px;margin:8px 6px;
  background:transparent;color:var(--face);
  border:1px solid var(--face);border-radius:2px;
  font-family:inherit;font-size:15px;letter-spacing:2px;cursor:pointer;
  transition:all .2s;
}
.btn:hover{background:rgba(143,196,212,.12)}
.btn.ghost{color:var(--text-dim);border-color:var(--line)}
.btn.danger{color:var(--breaker);border-color:var(--breaker)}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* ===== 金属图片按钮（首页，保持原并排位置与大小） ===== */
.ui-btn{
  background:none;border:none;cursor:pointer;padding:0;margin:8px 6px;position:relative;
  overflow:hidden;display:inline-block;vertical-align:middle;transition:transform .15s ease;
}
.ui-btn img{width:min(200px,34vw);height:auto;display:block;transition:filter .2s ease}
.ui-btn:hover img{filter:brightness(1.28) drop-shadow(0 0 18px rgba(190,215,230,.45))}
.ui-btn:active{transform:scale(.95)}
/* 扫光：悬停时一道光从左滑过金属面 */
.ui-btn::after{
  content:"";position:absolute;top:0;left:-80%;width:45%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-20deg);transition:left .55s ease;pointer-events:none;
}
.ui-btn:hover::after{left:135%}

/* ===== 首页 ===== */
.home{text-align:center;padding-top:6vh}
.home .kicker{color:var(--text-dim);letter-spacing:6px;font-size:13px;margin-bottom:12px}
.title-img{display:block;width:min(340px,58vw);height:auto;margin:6px auto 8px;filter:drop-shadow(0 0 26px rgba(143,196,212,.30))}
.home .sub{color:var(--text-dim);margin:14px auto 22px;max-width:480px;font-weight:300}
.home .foot{margin-top:28px;font-size:12px;color:#55606a;letter-spacing:1px}

/* ===== 选角页 ===== */
.section-title{font-size:13px;letter-spacing:4px;color:var(--text-dim);margin:36px 0 14px;
  border-left:3px solid var(--face);padding-left:10px}
.section-title.breaker{border-left-color:var(--breaker)}
.role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.role-card{
  background:var(--panel);border:1px solid var(--line);padding:18px;cursor:pointer;
  transition:all .2s;
}
.role-card:hover{border-color:var(--face);transform:translateY(-2px)}
.role-card.breaker:hover{border-color:var(--breaker)}
.role-card.locked{opacity:.45;cursor:not-allowed}
.role-card.locked:hover{transform:none;border-color:var(--line)}
.role-card .no{font-size:12px;color:var(--text-dim);letter-spacing:2px}
.role-card .name{font-family:"Noto Serif SC",serif;font-size:20px;margin:6px 0}
.role-card.face .name{color:var(--face)}
.role-card.breaker .name{color:var(--breaker)}
.role-card .brief{font-size:13px;color:var(--text-dim);line-height:1.7}
.role-card .tag{display:inline-block;margin-top:10px;font-size:11px;letter-spacing:1px;
  padding:2px 8px;border:1px solid var(--line);color:var(--text-dim)}

/* 带立绘的选角卡：立绘作低透明度背景，名字用发光字图，置于左上不挡脸 */
.portrait-card{position:relative;overflow:hidden;min-height:180px}
.portrait-card::before{
  content:"";position:absolute;right:0;bottom:0;width:62%;height:100%;z-index:0;pointer-events:none;
  background:var(--portrait) right bottom / contain no-repeat;
  opacity:.18;
}
.portrait-card > *{position:relative;z-index:1}
.portrait-card .name-img{display:block;height:38px;width:auto;max-width:120px;margin:2px 0 10px;
  filter:drop-shadow(0 0 12px rgba(143,196,212,.35))}

/* —— 剧情线达成板块（选角卡下方） —— */
.role-cell{display:flex;flex-direction:column}
.role-cell > .role-card{flex:0 0 auto}
.line-panel{margin-top:8px;padding:10px 12px 8px;border:1px solid var(--line);border-radius:10px;
  background:rgba(255,255,255,.02)}
.lp-title{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;
  letter-spacing:2px;color:var(--text-dim);margin-bottom:5px}
.lp-count{letter-spacing:0;color:var(--face)}
.line-panel.breaker .lp-count{color:var(--breaker)}
.lp-item{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;
  color:var(--text-dim);padding:3px 0;line-height:1.7}
.lp-item .lp-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-item.done{color:var(--text)}
.lp-badge{flex:none;font-size:11px;letter-spacing:1px;padding:1px 8px;border-radius:3px;
  color:#d98f7f;border:1px solid rgba(196,106,90,.5);background:rgba(196,106,90,.12)}
.lp-badge.done{color:#84d3a0;border-color:rgba(110,200,140,.55);background:rgba(110,200,140,.12)}

/* —— 成就板块（所有选角卡下方） —— */
.ach-panel{margin-top:26px;padding:16px 18px 18px;border:1px solid var(--line);border-radius:12px;
  background:rgba(255,255,255,.02)}
.ach-head{display:flex;align-items:center;gap:14px}
.ach-bar-wrap{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.ach-label{flex:none;font-size:12px;letter-spacing:2px;color:#5f9bd8}
.ach-bar{position:relative;flex:1;height:11px;min-width:60px;border-radius:999px;
  border:1px solid rgba(90,140,210,.45);background:rgba(70,120,190,.10);overflow:hidden}
.ach-fill{height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,rgba(79,143,214,.55),#4f8fd6);
  box-shadow:0 0 10px rgba(79,143,214,.45);transition:width .45s ease}
.ach-pct{flex:none;min-width:42px;text-align:right;font-size:13px;letter-spacing:1px;color:#5f9bd8}
.ach-clear{flex:none;padding:2px 14px;font-family:inherit;font-size:12px;letter-spacing:2px;line-height:1.9;
  color:#33619f;background:rgba(51,97,159,.16);border:1px solid #33619f;border-radius:3px;
  cursor:pointer;transition:all .2s}
.ach-clear:hover{color:#5a8ed6;border-color:#5a8ed6;background:rgba(90,142,214,.18)}
/* 成就条目区：分三组（面壁者线 / 破壁人线 / 全收集） */
.ach-body{margin-top:14px;min-height:110px;padding:4px 2px 2px}
.ach-group + .ach-group{margin-top:14px}
.ach-gt{font-size:11px;letter-spacing:3px;color:var(--text-dim);margin:0 0 8px 2px}
.ach-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
/* 成就卡：长方形卡框 + 左侧图标 + 成就文字；未解锁整体压低亮度 */
.ach-card{position:relative;overflow:hidden;
  display:flex;align-items:center;gap:12px;min-height:62px;padding:9px 14px;
  border:1px solid rgba(255,255,255,.10);border-radius:8px;background:rgba(255,255,255,.02);
  opacity:.55;transition:opacity .4s,border-color .4s,background .4s,box-shadow .4s}
/* 成就卡底图：低透明度的角色意象图，靠右渐隐，不压文字 */
.ach-card .ach-bg{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:var(--achbg);background-repeat:no-repeat;
  background-position:right center;background-size:auto 180%;
  opacity:.42;transition:opacity .4s;
  -webkit-mask-image:linear-gradient(to right,transparent 34%,rgba(0,0,0,.5) 62%,#000 92%);
  mask-image:linear-gradient(to right,transparent 34%,rgba(0,0,0,.5) 62%,#000 92%)}
.ach-card > .ach-icon,.ach-card > .ach-meta,.ach-card > .ach-state{position:relative;z-index:1}
.ach-card .ach-icon{flex:none;width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.03);
  color:#8195a2;transition:all .4s}
.ach-card .ach-icon svg{width:23px;height:23px}
.ach-card .ach-meta{display:block;flex:1;min-width:0}
.ach-card .ach-who{display:block;font-size:11px;letter-spacing:2px;color:var(--text-dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ach-card .ach-name{display:block;font-family:"Noto Serif SC",serif;font-size:15px;letter-spacing:1px;
  color:#93a4ae;margin-top:2px;transition:color .4s}
.ach-card .ach-desc{display:block;font-size:11px;color:var(--text-dim);margin-top:3px;line-height:1.6}
.ach-card .ach-state{flex:none;font-size:10px;letter-spacing:1px;padding:1px 7px;border-radius:3px;
  color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.14)}
/* 已解锁：恢复正常亮度 + 冷青描边发光 */
.ach-card.on{opacity:1;border-color:rgba(143,196,212,.5);background:rgba(143,196,212,.08);
  box-shadow:0 0 16px rgba(143,196,212,.14),inset 0 0 24px rgba(143,196,212,.05)}
.ach-card.on .ach-icon{color:#cdeef9;border-color:rgba(143,196,212,.6);
  box-shadow:0 0 14px rgba(143,196,212,.28);background:rgba(143,196,212,.12)}
.ach-card.on .ach-name{color:#e2f2f7;text-shadow:0 0 12px rgba(143,196,212,.35)}
.ach-card.on .ach-state{color:#84d3a0;border-color:rgba(110,200,140,.55);background:rgba(110,200,140,.12)}
.ach-card.final{grid-column:1 / -1}
/* 已解锁可点开分享海报 */
.ach-card.on{cursor:pointer}
.ach-card.on:hover{border-color:rgba(143,196,212,.8);box-shadow:0 0 24px rgba(143,196,212,.22),inset 0 0 24px rgba(143,196,212,.06)}
.ach-card.on:active{transform:scale(.995)}
.ach-card .ach-dl{flex:none;font-size:10px;letter-spacing:1px;color:#8fc4d4;border:1px solid rgba(143,196,212,.45);
  border-radius:3px;padding:1px 7px;background:rgba(143,196,212,.10)}
.ach-card .ach-tip{display:block;font-size:10px;letter-spacing:1px;color:rgba(143,196,212,.72);margin-top:5px}
/* 成就分享海报弹窗 */
.poster-modal{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(3,7,12,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .28s ease}
.poster-modal.show{opacity:1;pointer-events:auto}
.poster-box{position:relative;width:min(420px,92vw);max-height:94vh;overflow:auto;
  padding:14px 14px 16px;border:1px solid rgba(143,196,212,.4);border-radius:12px;
  background:linear-gradient(180deg,rgba(13,21,30,.98),rgba(8,12,18,.98));
  box-shadow:0 24px 70px rgba(0,0,0,.7),0 0 40px rgba(143,196,212,.12)}
.poster-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.poster-head .ph-t{font-size:11px;letter-spacing:3px;color:#8fc4d4}
.poster-head .ph-n{flex:1;min-width:0;font-size:13px;color:#e2f2f7;font-family:"Noto Serif SC",serif;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poster-head .ph-x{flex:none;width:28px;height:28px;line-height:26px;text-align:center;border-radius:50%;
  border:1px solid rgba(143,196,212,.35);color:#9fb6c2;cursor:pointer;font-size:16px}
.poster-slot{position:relative;min-height:180px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:rgba(4,8,13,.6);border-radius:6px;overflow:hidden}
.poster-slot img{display:block;width:100%;height:auto}
.poster-slot .ach-loading{font-size:12px;letter-spacing:2px;color:var(--text-dim)}
.poster-actions{display:flex;gap:10px;justify-content:center;margin-top:12px}
.poster-actions .btn{padding:9px 20px;font-size:13px}
.poster-hint{margin-top:8px;font-size:11px;letter-spacing:1px;color:#6f7d87;text-align:center}
/* 游玩中达成成就：页面下方弹出的提示卡 */
.ach-toast{position:fixed;left:50%;bottom:26px;z-index:140;pointer-events:none;
  transform:translate(-50%,18px);opacity:0;transition:opacity .45s ease,transform .45s ease;
  min-width:330px;padding:12px 16px 14px;border-radius:12px;
  background:rgba(12,18,26,.9);border:1px solid rgba(143,196,212,.45);
  box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 26px rgba(143,196,212,.18);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ach-toast.show{opacity:1;transform:translate(-50%,0)}
.ach-toast .toast-cap{font-size:11px;letter-spacing:4px;color:#8fc4d4;margin-bottom:8px;text-align:center}
.ach-toast .ach-card{opacity:1;border-color:rgba(143,196,212,.5);background:rgba(143,196,212,.08);
  box-shadow:none}
@media(max-width:720px){
  .ach-grid{grid-template-columns:1fr}
  .ach-card .ach-state{display:none}   /* 手机端只留「海报」入口，避免右侧太挤 */
  .ach-card .ach-dl{position:absolute;right:10px;top:9px}
  .ach-card .ach-meta{padding-right:6px}
  .ach-card .ach-tip{font-size:9px;margin-top:4px}
  .poster-box{width:min(360px,94vw)}
  .ach-head{flex-wrap:wrap}
  .ach-clear{order:2}
}

/* ===== 剧情页 ===== */
.story-head{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:24px}
.story-head .chapter{font-family:"Noto Serif SC",serif;color:var(--gold);letter-spacing:2px;font-size:15px}
.story-head .back{color:var(--text-dim);font-size:13px;cursor:pointer;text-decoration:underline}
.speaker{color:var(--face);font-size:14px;letter-spacing:2px;margin-bottom:10px}
.speaker.breaker{color:var(--breaker)}
.story-text{font-size:17px;line-height:2.2;min-height:120px;white-space:pre-wrap}
.story-text .cursor{color:var(--face);animation:blink 1s infinite}
/* 「跳过」逐字展示：位于正文右上侧，不超出正文栏 */
.skip-row{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:-4px 0 8px}
.skip-btn{padding:1px 12px;font-family:inherit;font-size:12px;letter-spacing:2px;line-height:1.8;
  color:#8feaff;background:linear-gradient(90deg,rgba(38,178,255,.18),rgba(38,178,255,.06));
  border:1px solid rgba(95,220,255,.85);border-radius:3px;
  cursor:pointer;transition:all .22s;
  box-shadow:0 0 12px rgba(64,196,255,.3),inset 0 0 10px rgba(64,196,255,.1);
  text-shadow:0 0 6px rgba(95,220,255,.6),0 0 14px rgba(64,196,255,.4)}
.skip-btn:hover{color:#d4f7ff;border-color:#8fe9ff;
  background:linear-gradient(90deg,rgba(38,178,255,.32),rgba(38,178,255,.12));
  box-shadow:0 0 22px rgba(64,196,255,.55),inset 0 0 14px rgba(64,196,255,.16)}
.skip-btn.is-done{opacity:.5;cursor:default;
  box-shadow:0 0 10px rgba(64,196,255,.16);text-shadow:0 0 5px rgba(95,220,255,.3)}
/* 「返回上一章」：跟在选项下方，荧光蓝描边 */
.story-back-row{margin-top:18px;display:flex;align-items:center;gap:10px}
.story-back{display:inline-flex;align-items:center;gap:7px;padding:8px 22px 8px 14px;
  font-family:inherit;font-size:14px;letter-spacing:3px;line-height:1.8;
  color:#8feaff;background:linear-gradient(90deg,rgba(38,178,255,.2),rgba(38,178,255,.07));
  border:1px solid rgba(95,220,255,.85);border-radius:4px;cursor:pointer;
  box-shadow:0 0 20px rgba(64,196,255,.4),inset 0 0 14px rgba(64,196,255,.14);
  text-shadow:0 0 6px rgba(95,220,255,.75),0 0 16px rgba(64,196,255,.5);transition:all .22s}
.story-back:hover{color:#d4f7ff;border-color:#8fe9ff;
  background:linear-gradient(90deg,rgba(38,178,255,.34),rgba(38,178,255,.14));
  box-shadow:0 0 26px rgba(64,196,255,.62),inset 0 0 18px rgba(64,196,255,.2)}
.story-back svg{width:13px;height:13px;flex:none}
.story-back[disabled]{opacity:.42;cursor:default;color:#5f7d8c;
  border-color:rgba(95,125,140,.45);background:rgba(20,30,38,.42);
  box-shadow:none;text-shadow:none}
.story-back[disabled]:hover{color:#5f7d8c;border-color:rgba(95,125,140,.45);
  background:rgba(20,30,38,.42)}
@media(max-width:720px){ .story-back{font-size:12px;padding:6px 14px 6px 10px} }
@keyframes blink{50%{opacity:0}}
.choices{margin-top:36px;display:flex;flex-direction:column;gap:10px}
.choice-btn{
  text-align:left;padding:14px 18px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--text);cursor:pointer;
  font-family:inherit;font-size:15px;transition:all .2s;
}
.choice-btn:hover{border-color:var(--face);padding-left:24px}
.choice-btn .hint{display:block;font-size:12px;color:var(--text-dim);margin-top:4px}
.ending{margin-top:30px;padding:18px;border:1px dashed var(--gold);color:var(--gold);
  font-family:"Noto Serif SC",serif;letter-spacing:2px}

/* ===== 结局成就卡 ===== */
.ach-slot{margin:16px auto 0;max-width:330px;min-height:120px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:rgba(6,10,16,.55)}
.ach-slot img{display:block;width:100%;height:auto;border:0}
.ach-loading{font-size:12px;letter-spacing:2px;color:var(--text-dim)}
.ach-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.ach-actions .btn{padding:9px 22px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ach-hint{margin-top:8px;font-size:11.5px;letter-spacing:1px;color:#6f7d87;text-align:center}

/* ===== 角色立绘（故事页右下角，底部贴合，不遮文字） ===== */
.portrait{
  position:fixed;right:0;bottom:0;z-index:-1;height:min(330px,44vh);
  pointer-events:none;opacity:.95;
  mask-image:linear-gradient(to top,#000 78%,transparent);
  -webkit-mask-image:linear-gradient(to top,#000 78%,transparent);
  filter:drop-shadow(-12px 0 28px rgba(0,0,0,.55));
}
.portrait-text{padding-right:200px}
@media(max-width:720px){
  .portrait{height:210px;opacity:.7;mask-image:linear-gradient(to top,#000 70%,transparent);-webkit-mask-image:linear-gradient(to top,#000 70%,transparent)}
  .portrait-text{padding-right:120px}
}

/* ===== 资料库 ===== */
.archive-card{background:var(--panel);border:1px solid var(--line);padding:18px;margin-bottom:14px}
.archive-card .row{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.archive-card .name{font-family:"Noto Serif SC",serif;font-size:19px}
.archive-card.face .name{color:var(--face)}
.archive-card.breaker .name{color:var(--breaker)}
.archive-card .role-tag{font-size:12px;color:var(--text-dim);letter-spacing:1px}
.archive-card .desc{font-size:14px;color:var(--text);margin:10px 0 8px}
.archive-card .rels{font-size:13px;color:var(--text-dim)}
.archive-card .rels b{color:var(--text);font-weight:500}
.note{background:var(--panel-2);border-left:3px solid var(--gold);padding:14px 16px;
  font-size:13px;color:var(--text-dim);margin:20px 0;line-height:1.8}

/* ===== 说明面板 ===== */
details{background:var(--panel);border:1px solid var(--line);padding:16px;margin:20px 0}
details summary{cursor:pointer;font-family:"Noto Serif SC",serif;color:var(--gold);letter-spacing:2px}
details p,details li{font-size:14px;color:var(--text-dim);margin:8px 0}
details code{background:#0a0f14;padding:2px 6px;color:var(--face);font-size:13px}

@media (max-width:560px){
  #app{padding:24px 14px 60px}
  .home{padding-top:6vh}
}

/* ============================================================
   知识图谱页（内嵌完整版静态图谱）
   ============================================================ */
/* 打开完整版：固定在左下角，避开右上角的音乐控件 */
.kg-open{position:fixed;left:22px;bottom:16px;z-index:60;display:inline-flex;align-items:center;
  padding:7px 15px;border:1px solid var(--line);border-radius:8px;cursor:pointer;
  font-size:12.5px;letter-spacing:1px;color:var(--text-dim);
  background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.kg-open:hover{border-color:var(--face);color:var(--face)}

/* —— 完整版内嵌 —— */
.kg-frame-wrap{position:relative;height:min(78vh,760px);min-height:480px;
  border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#070b16}
#kg-frame{width:100%;height:100%;border:0;display:block}
.kg-loading{display:flex;align-items:center;justify-content:center;
  height:100%;color:var(--text-dim);font-size:14px;letter-spacing:1px}

/* —— 图谱页：突破正文限宽，铺满屏幕 —— */
body.kg-mode #app{max-width:none;padding:14px 20px 18px}
body.kg-mode .story-head{position:relative;justify-content:flex-start;padding-right:56px}
body.kg-mode .kg-back{position:absolute;left:50%;top:0;transform:translateX(-50%);white-space:nowrap}
body.kg-mode .kg-frame-wrap{height:calc(100vh - 142px);min-height:560px}
/* ===== 背景音乐控件（全局右上角） ===== */
.bgm-control{position:fixed;top:14px;right:16px;z-index:99;display:flex;align-items:center;gap:8px}
.bgm-btn{
  width:38px;height:38px;border-radius:50%;cursor:pointer;flex:none;
  background:var(--panel);border:1px solid var(--line);color:var(--face);
  display:flex;align-items:center;justify-content:center;transition:all .2s;backdrop-filter:blur(8px);
}
.bgm-btn:hover{border-color:var(--face);box-shadow:0 0 14px rgba(143,196,212,.3)}
.bgm-btn svg{width:20px;height:20px}
.bgm-panel{
  display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  padding:8px 12px;border-radius:20px;backdrop-filter:blur(8px);
  opacity:0;transform:translateX(8px);pointer-events:none;transition:all .2s;
}
.bgm-control:hover .bgm-panel,.bgm-panel:focus-within{opacity:1;transform:translateX(0);pointer-events:auto}
.bgm-vol-label{font-size:12px;color:var(--text-dim)}
#bgm-vol{width:110px;accent-color:var(--face);cursor:pointer}

/* ===== 存档：首页「存档」交互键 + 悬浮存档面板 ===== */
.save-dock{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:2px 0 0}
.save-tab{
  display:inline-flex;align-items:center;gap:8px;
  padding:3px 15px;font-family:inherit;font-size:12px;letter-spacing:3px;line-height:1.9;
  color:#8feaff;background:linear-gradient(90deg,rgba(38,178,255,.18),rgba(38,178,255,.06));
  border:1px solid rgba(95,220,255,.82);
  border-radius:3px;cursor:pointer;transition:all .22s;
  box-shadow:0 0 14px rgba(64,196,255,.32),inset 0 0 10px rgba(64,196,255,.1);
  text-shadow:0 0 6px rgba(95,220,255,.6),0 0 14px rgba(64,196,255,.4);
}
.save-tab:hover,.save-tab.is-open{color:#d4f7ff;border-color:#8fe9ff;
  background:linear-gradient(90deg,rgba(38,178,255,.32),rgba(38,178,255,.12));
  box-shadow:0 0 24px rgba(64,196,255,.58),inset 0 0 14px rgba(64,196,255,.16)}
.save-tab svg{width:14px;height:14px;opacity:.9;flex:none}
.save-tab .save-n{letter-spacing:0;font-size:11px;color:#d6f4ff;opacity:.85;text-shadow:0 0 8px rgba(95,220,255,.5)}
/* 面板挂在一个固定在视口上的透明层里：不会把首页撑长，也不会被正文限宽裁掉 */
.save-stage{position:fixed;left:0;top:0;right:0;bottom:0;z-index:150;pointer-events:none}
.save-stage[hidden]{display:none}
.save-panel{
  position:absolute;width:min(436px,calc(100vw - 24px));
  pointer-events:auto;
  padding:13px 16px 10px;border-radius:12px;
  background:rgba(10,15,21,.95);border:1px solid rgba(143,196,212,.34);
  box-shadow:0 18px 50px rgba(0,0,0,.62),0 0 26px rgba(143,196,212,.10);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transform-origin:50% 100%;overflow:hidden;
}
/* —— 展开 / 收束特效 —— */
.save-panel.is-opening{animation:savePanelIn .38s cubic-bezier(.16,.86,.3,1) both}
.save-panel.is-closing{animation:savePanelOut .22s ease-in forwards}
@keyframes savePanelIn{
  0%{opacity:0;transform:translateY(10px) scale(.955);filter:blur(4px);
     box-shadow:0 0 0 rgba(0,0,0,0),0 0 0 rgba(127,230,255,0)}
  45%{opacity:.94;filter:blur(0);box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 30px rgba(127,230,255,.5)}
  100%{opacity:1;transform:none;filter:blur(0);
     box-shadow:0 18px 50px rgba(0,0,0,.62),0 0 26px rgba(143,196,212,.10)}
}
@keyframes savePanelOut{
  0%{opacity:1;transform:none;filter:blur(0)}
  100%{opacity:0;transform:translateY(8px) scale(.965);filter:blur(4px)}
}
/* 扫描光带：开面板时自上而下扫一道青光 */
.save-panel::before{
  content:"";position:absolute;left:0;right:0;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent 6%,rgba(127,230,255,.95) 50%,transparent 94%);
  box-shadow:0 0 14px rgba(127,230,255,.75);opacity:0
}
.save-panel.is-opening::before{animation:saveScan .55s cubic-bezier(.4,0,.2,1) both}
@keyframes saveScan{
  0%{top:0;opacity:0}
  12%{opacity:.95}
  82%{opacity:.75}
  100%{top:100%;opacity:0}
}
/* 四角描线：展开时从四角往里亮一下 */
.save-panel::after{
  content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;opacity:0;
  background:
    linear-gradient(#7fe6ff,#7fe6ff) left top/18px 1px no-repeat,
    linear-gradient(#7fe6ff,#7fe6ff) left top/1px 18px no-repeat,
    linear-gradient(#7fe6ff,#7fe6ff) right top/18px 1px no-repeat,
    linear-gradient(#7fe6ff,#7fe6ff) right top/1px 18px no-repeat,
    linear-gradient(#7fe6ff,#7fe6ff) left bottom/18px 1px no-repeat,
    linear-gradient(#7fe6ff,#7fe6ff) left bottom/1px 18px no-repeat,
    linear-gradient(#7fe6ff,#7fe6ff) right bottom/18px 1px no-repeat,
    linear-gradient(#7fe6ff,#7fe6ff) right bottom/1px 18px no-repeat;
}
.save-panel.is-opening::after{animation:saveCorners .5s ease-out both}
@keyframes saveCorners{
  0%{opacity:0;transform:scale(1.06)}
  30%{opacity:1}
  100%{opacity:0;transform:scale(1)}
}
/* 行逐条浮现 */
.save-panel.is-opening .save-head{animation:saveRowIn .3s .06s both}
.save-panel.is-opening .save-row{animation:saveRowIn .32s both}
@keyframes saveRowIn{
  0%{opacity:0;transform:translateY(7px)}
  100%{opacity:1;transform:none}
}
.save-head{display:flex;align-items:baseline;gap:10px;padding-bottom:8px;
  border-bottom:1px solid rgba(255,255,255,.09)}
.save-title{flex:1;min-width:0;font-family:"Noto Serif SC",serif;font-size:14px;letter-spacing:3px;color:#cdeef9}
.save-x{flex:none;width:22px;height:22px;line-height:20px;text-align:center;font-size:14px;
  font-family:inherit;color:var(--text-dim);background:transparent;border:none;cursor:pointer}
.save-x:hover{color:#e0927f}
.save-row{display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid rgba(255,255,255,.055)}
.save-row:last-of-type{border-bottom:none}
.save-tag{flex:none;width:50px;text-align:center;font-size:10px;letter-spacing:1px;line-height:1.7;
  padding:1px 0;border-radius:3px;border:1px solid rgba(255,255,255,.14);color:var(--text-dim)}
.save-tag.auto{color:#8fc4d4;border-color:rgba(143,196,212,.45);background:rgba(143,196,212,.10)}
.save-tag.manual{color:#c9b98a;border-color:rgba(201,185,138,.4);background:rgba(201,185,138,.08)}
.save-info{flex:1;min-width:0}
.save-role{display:block;font-size:12.5px;letter-spacing:1px;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.save-role em{margin-left:7px;font-style:normal;font-size:11px;letter-spacing:0;color:#8a97a1}
.save-meta{display:block;font-size:11px;color:var(--text-dim);margin-top:2px;letter-spacing:.3px}
.save-meta .mode{color:#8fc4d4}
.save-meta .mode.manual{color:#c9b98a}
.save-act{flex:none;display:flex;gap:5px}
.sbtn{padding:2px 8px;font-family:inherit;font-size:11px;letter-spacing:1px;line-height:1.75;
  background:transparent;border:1px solid rgba(255,255,255,.16);border-radius:3px;
  color:var(--text-dim);cursor:pointer;transition:all .18s;white-space:nowrap}
.sbtn:hover{color:var(--text);border-color:rgba(255,255,255,.34)}
.sbtn.load{color:#5f9bd8;border-color:rgba(90,140,210,.55);background:rgba(90,142,214,.12)}
.sbtn.load:hover{color:#8ec2ef;border-color:rgba(120,175,230,.8);background:rgba(90,142,214,.22)}
.sbtn.save{color:#c9b98a;border-color:rgba(201,185,138,.45);background:rgba(201,185,138,.08)}
.sbtn.save:hover{color:#e2d4a4;border-color:rgba(201,185,138,.8);background:rgba(201,185,138,.16)}
.sbtn.del{color:#b57a6d;border-color:rgba(196,106,90,.4)}
.sbtn.del:hover{color:#e0927f;border-color:rgba(196,106,90,.8);background:rgba(196,106,90,.14)}
.sbtn[data-wait="1"]{color:#e6a996;border-color:rgba(196,106,90,.9);background:rgba(196,106,90,.16)}
.save-empty{display:block;font-size:12.5px;color:#6f7d87;letter-spacing:1px}
.save-msg{min-height:15px;margin-top:7px;font-size:11px;letter-spacing:.5px;color:#84d3a0;opacity:0;transition:opacity .25s}
.save-msg.show{opacity:1}
@media(max-width:560px){
  .save-act{flex-wrap:wrap;justify-content:flex-end;max-width:110px}
  .save-tag{width:44px}
}

/* ===== 登录 / 注册 ===== */
.auth{min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;gap:18px}
.auth-brand{font-size:12px;letter-spacing:7px;color:var(--face);opacity:.85}
.auth-card{width:min(420px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:4px;
  padding:24px 26px 22px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.auth-tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:13px}
.auth-tab{flex:1;background:transparent;border:1px solid transparent;color:var(--text-dim);font-family:inherit;
  font-size:13px;letter-spacing:2px;padding:8px 0;cursor:pointer;transition:.2s}
.auth-tab.on{color:var(--face);border-color:rgba(143,196,212,.45);background:rgba(143,196,212,.08)}
.auth-field{margin-bottom:13px}
.auth-label{display:block;font-size:11.5px;letter-spacing:2px;color:var(--text-dim);margin-bottom:6px}
.auth-input{width:100%;box-sizing:border-box;background:rgba(8,12,16,.7);border:1px solid var(--line);
  color:var(--text);font-family:inherit;font-size:14px;letter-spacing:1px;padding:10px 12px;border-radius:3px;outline:none;transition:.18s}
.auth-input:focus{border-color:rgba(143,196,212,.7);box-shadow:0 0 0 2px rgba(143,196,212,.12)}
.auth-input::placeholder{color:#5a6672;letter-spacing:1.5px}
.auth-pwd{display:flex;align-items:center;gap:8px}
.auth-eye{flex:none;background:transparent;border:1px solid var(--line);color:var(--text-dim);width:42px;height:40px;
  border-radius:3px;cursor:pointer;display:grid;place-items:center;transition:.18s}
.auth-eye:hover{color:var(--face);border-color:rgba(143,196,212,.5)}
.auth-eye svg{width:18px;height:18px}
.auth-msg{min-height:17px;font-size:12px;letter-spacing:.5px;margin:2px 0 11px;color:#e0927f;line-height:1.7}
.auth-msg.ok{color:#84d3a0}
.auth-submit{width:100%;padding:12px;font-family:inherit;font-size:14px;letter-spacing:5px;color:var(--face);
  background:rgba(143,196,212,.08);border:1px solid rgba(143,196,212,.5);border-radius:3px;cursor:pointer;transition:.2s}
.auth-submit:hover:not(:disabled){background:rgba(143,196,212,.18);color:#dff2f8}
.auth-submit:disabled{opacity:.55;cursor:default}
.auth-alt{margin-top:14px;text-align:center;font-size:12.5px;letter-spacing:1px;color:var(--text-dim)}
.auth-alt a{color:var(--face);cursor:pointer;text-decoration:none;border-bottom:1px dashed rgba(143,196,212,.4)}
.auth-foot{font-size:11px;letter-spacing:1.5px;color:#5b6873;text-align:center;line-height:1.95}
.auth-mode .bgm-control{display:none!important}
/* 首页用户条 */
.who{display:flex;justify-content:center;align-items:center;gap:10px;font-size:12px;letter-spacing:1.5px;
  color:var(--text-dim);margin:2px 0 10px;flex-wrap:wrap}
.who b{color:var(--face);font-weight:400;letter-spacing:2px}
.who a{color:var(--gold);cursor:pointer;text-decoration:none;border-bottom:1px dashed rgba(201,185,138,.4)}
.who .guest{color:#c9b98a}
/* 管理后台 */
.admin{max-width:820px;margin:0 auto;padding:64px 20px 90px}
.admin h1{font-size:20px;letter-spacing:8px;color:var(--face);font-weight:400;margin:0 0 8px}
.admin-sub{font-size:12.5px;letter-spacing:1.5px;color:var(--text-dim);margin-bottom:24px}
.admin-stat{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.admin-stat div{background:var(--panel);border:1px solid var(--line);padding:13px 22px;border-radius:3px;
  font-size:11.5px;letter-spacing:2px;color:var(--text-dim)}
.admin-stat b{display:block;font-size:23px;color:var(--face);font-weight:400;margin-bottom:4px;letter-spacing:2px}
.admin-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);font-size:13px}
.admin-table th,.admin-table td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;letter-spacing:1px}
.admin-table th{font-weight:400;color:var(--text-dim);font-size:11.5px;letter-spacing:2px}
.admin-table td{color:var(--text)}
.admin-table tr:last-child td{border-bottom:none}
.admin-table .role-admin{color:var(--gold)}
.admin-note{margin-top:22px;font-size:12px;color:var(--text-dim);line-height:1.95;background:var(--panel-2);
  border-left:3px solid var(--gold);padding:14px 16px;letter-spacing:1px}
.admin-back{display:inline-block;margin-top:26px;font-size:12.5px;letter-spacing:2px;color:var(--text-dim);cursor:pointer}
.admin-back:hover{color:var(--face)}
/* 轻提示 */
.toast-msg{position:fixed;left:50%;bottom:46px;transform:translateX(-50%) translateY(10px);z-index:60;
  background:rgba(10,15,20,.94);border:1px solid rgba(143,196,212,.4);color:var(--text);font-size:12.5px;
  letter-spacing:1px;padding:10px 20px;border-radius:3px;opacity:0;pointer-events:none;transition:.25s;max-width:82vw;text-align:center}
.toast-msg.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ===== 讨论交流区 ===== */
.board{max-width:860px;margin:0 auto;padding:54px 20px 90px}
.board-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.board-title{font-size:20px;letter-spacing:8px;color:var(--face);font-weight:400}
.board-sub{font-size:12px;letter-spacing:1.5px;color:var(--text-dim)}
.board-tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px}
.board-tab{position:relative;padding:8px 2px;font-size:13px;letter-spacing:3px;color:var(--text-dim);
  cursor:pointer;border-bottom:2px solid transparent;transition:.2s}
.board-tab:hover{color:var(--text)}
.board-tab.on{color:var(--face);border-color:var(--face)}
.board-write{background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:4px;margin-bottom:20px}
.board-write textarea{width:100%;box-sizing:border-box;min-height:76px;resize:vertical;background:rgba(8,12,16,.7);
  border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:13.5px;line-height:1.9;
  padding:10px 12px;border-radius:3px;outline:none;transition:.18s}
.board-write textarea:focus{border-color:rgba(143,196,212,.6)}
.board-write-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:12px}
.board-tip{font-size:11.5px;color:var(--text-dim);letter-spacing:1px}
.board-send{padding:7px 26px;font-family:inherit;font-size:12.5px;letter-spacing:3px;color:var(--face);
  background:rgba(143,196,212,.08);border:1px solid rgba(143,196,212,.5);border-radius:3px;cursor:pointer;transition:.2s}
.board-send:hover:not(:disabled){background:rgba(143,196,212,.18);color:#dff2f8}
.board-send:disabled{opacity:.5;cursor:default}
.post{background:var(--panel);border:1px solid var(--line);border-left:3px solid rgba(143,196,212,.35);
  padding:14px 16px;margin-bottom:12px;border-radius:3px}
.post-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.post-user{font-size:12.5px;letter-spacing:2px;color:var(--face)}
.post-time{font-size:11px;letter-spacing:1px;color:#5f6b75}
.post-text{font-size:13.5px;line-height:2;color:var(--text);white-space:pre-wrap;word-break:break-word}
.post-acts{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.pact{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;font-family:inherit;font-size:11.5px;

/* 剧情线达成进度：记录已抵达的结局节点，存在本机 localStorage 里 */
const ENDINGS_KEY = "santi_endings_v1";
const END_TIMES_KEY = "santi_endings_time_v1";   // 每个结局首次达成的时间，用于成就海报上的日期
function endingsDone(){
  try{ return new Set(JSON.parse(localStorage.getItem(ENDINGS_KEY) || "[]")); }
  catch(e){ return new Set(); }
}
function endTimesMap(){
  try{
    const o = JSON.parse(localStorage.getItem(END_TIMES_KEY) || "{}");
    return (o && typeof o === "object" && !Array.isArray(o)) ? o : {};
  }catch(e){ return {}; }
}
function markEnding(id){
  const sc = STORY[id];
  if(!sc || (sc.choices || []).length) return;   // 只认结局节点（choices 为空）
  const done = endingsDone();
  const times = endTimesMap();
  if(done.has(id) && times[id]) return;   // 已记录过，不重复写
  if(!done.has(id)){
    done.add(id);
    try{ localStorage.setItem(ENDINGS_KEY, JSON.stringify([...done])); }catch(e){}
  }
  if(!times[id]){
    times[id] = Date.now();
    try{ localStorage.setItem(END_TIMES_KEY, JSON.stringify(times)); }catch(e){}
  }
  cloudTouch();
  notifyAchievements();   // 刚好集满某个角色/全部角色时弹出成就卡
}
/* 某个角色的剧情线结局：按该角色的入口节点前缀取，罗辑主线不吞自破线 */
function roleEndings(r){
  const pre = String(r.line || "").replace(/_1$/, "_");
  return Object.keys(STORY).filter(id=>{
    if(!id.startsWith(pre)) return false;
    if(pre === "luoji_" && id.startsWith("luoji_wb_")) return false;
    return !(STORY[id].choices || []).length;
  }).sort((a,b)=>{
    const ra = a.endsWith("_good") ? 0 : 1, rb = b.endsWith("_good") ? 0 : 1;
    return ra - rb || a.localeCompare(b);
  });
}
/* 全部结局节点（即 16 条剧情线的终点），用于总进度 */
function allEndingIds(){
  return Object.keys(STORY).filter(id => !(STORY[id].choices || []).length);
}
/* 清空达成记录（只清本机的结局进度与成就解锁记录，不动剧情本身） */
function clearEndings(){
  try{ localStorage.removeItem(ENDINGS_KEY); }catch(e){}
  try{ localStorage.removeItem(END_TIMES_KEY); }catch(e){}
  try{ localStorage.removeItem(ACH_SEEN_KEY); }catch(e){}
  cloudTouch();
  renderSelect();
}

const TYPE_SFX_VOL = 0.3;
let typeAudio = null, typeRunning = false;
function typeSfxAudio(){
  if(!typeAudio){
    typeAudio = new Audio("assets/type.mp3");
    typeAudio.loop = true;
    typeAudio.preload = "auto";
    typeAudio.volume = TYPE_SFX_VOL;
  }
  return typeAudio;
}
function typeSfxStart(){
  const a = typeSfxAudio();
  typeRunning = true;
  try{ a.currentTime = 0; a.play().catch(()=>{}); }catch(e){}
}
function typeSfxStop(){
  typeRunning = false;
  if(!typeAudio) return;
  try{ typeAudio.pause(); typeAudio.currentTime = 0; }catch(e){}
}
/* 若首次被浏览器拦了自动播放，下一次点击时补上 */

/* 简单打字机效果，不想用可以删掉，直接把 text 写进去 */
let typeTimer = null, typeDone = null, typeText = "";
function typewriter(text, done){
  const el = document.getElementById("storyText");
  typeText = text; typeDone = done; let i = 0;
  if(typeTimer){ clearInterval(typeTimer); typeTimer = null; }
  el.innerHTML = "";
  typeSfxStart();
  typeTimer = setInterval(()=>{
    el.innerHTML = text.slice(0, ++i) + '<span class="cursor">▍</span>';
    if(i >= text.length) finishTyping();
  }, 28);
}
/* 一次性把整段文字铺满，并立刻放行选项（供「跳过」使用） */
function finishTyping(){
  if(typeTimer){ clearInterval(typeTimer); typeTimer = null; }
  typeSfxStop();
  const el = document.getElementById("storyText");
  if(el) el.innerHTML = typeText;
  const btn = document.getElementById("skipBtn");
  if(btn) btn.classList.add("is-done");
  const d = typeDone; typeDone = null;
  if(d) d();
}
function skipTyping(){ finishTyping(); }

/* 从剧情图倒推上一章：谁的选择能走到这一章，就回那一章（同一角色线优先） */
function prevNodeOf(id){
  const role = roleOfNode(id);
  let other = null;
  for(const k in STORY){
    if(k === id) continue;
    const s = STORY[k];
    if(!s || !s.choices || !s.choices.length) continue;
    if(s.choices.some(c => c && c.to === id)){
      if(roleOfNode(k) === role) return k;
      if(!other) other = k;
    }
  }
  return other;
}

/* 返回上一章：沿刚才走过的章节路径退一步；读档进来没有路径时，按剧情图倒推 */
function storyGoBack(){
  const cur = currentStoryId || (location.hash.split("/")[1] || "");
  let prev = null;
  if(storyHist.length >= 2){
    storyHist.pop();
    prev = storyHist[storyHist.length-1];
  }else{
    prev = prevNodeOf(cur);
    if(prev) storyHist = [prev];
  }
  if(!prev || prev === cur) return;
  storyBacking = true;              // 这次跳转不再压栈
  const target = "#story/" + prev;
  if(location.hash === target){ storyBacking = false; renderStory(prev); return; }
  location.hash = target;
}

let ACH_DATAURL = "";
function achEndingName(s){
  return String(s.chapter || "结局").replace(/^结局\s*·\s*/, "").replace(/^结局\s*/, "") || "结局";
}
function achRole(id){
  const r = roleOfNode(id);
  return r.replace(/^未知角色$/, "面壁者").replace(/（.*?）/g, "");
}
function drawSpaced(g, str, x, y, sp){
  const chars = [...String(str)];
  const ws = chars.map(c=>g.measureText(c).width);
  const total = ws.reduce((a,b)=>a+b,0) + sp*(chars.length-1);
  let cx = x - total/2;
  chars.forEach((c,i)=>{ g.fillText(c, cx, y); cx += ws[i] + sp; });
}
async function makeAchievementCard(sceneId, s){

  cv.width = W; cv.height = H;

    await Promise.all([
      document.fonts.load('900 92px "Noto Serif SC"'),
      document.fonts.load('700 30px "Noto Serif SC"'),

      document.fonts.load('300 20px "Noto Sans SC"')

  }catch(e){}

  const bg = g.createLinearGradient(0, 0, 0, H);

  halo.addColorStop(0, "rgba(96,168,196,.20)"); halo.addColorStop(.4, "rgba(48,92,120,.09)");
  halo.addColorStop(.75, "rgba(20,40,56,.03)"); halo.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = halo; g.fillRect(0, 0, W, H);

  // 星点（固定种子，每次同一张卡）
  let seed = 20261128;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  for(let i = 0; i < 320; i++){
    const x = rnd()*W, y = rnd()*H, r = rnd()*1.5 + .25, a = .12 + rnd()*.55;
    g.fillStyle = `rgba(206,228,240,${a})`;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
  }
  // 底部微光弧线（星体边缘）
  g.save();
  const planet = g.createRadialGradient(W*.78, H*.72, 10, W*.78, H*.72, 520);
  planet.addColorStop(0, "rgba(0,0,0,0)"); planet.addColorStop(.62, "rgba(88,150,180,.05)");
  planet.addColorStop(.66, "rgba(120,180,210,.13)"); planet.addColorStop(.72, "rgba(0,0,0,0)");
  g.fillStyle = planet; g.fillRect(0, 0, W, H);
  g.restore();

  // 细金框 + 青色角标
  g.strokeStyle = "rgba(201,185,138,.34)"; g.lineWidth = 1.5;
  g.strokeRect(56, 56, W-112, H-112);
  g.strokeStyle = "rgba(143,196,212,.55)"; g.lineWidth = 2;
  const C = 46;
  [[56,56,1,1],[W-56,56,-1,1],[56,H-56,1,-1],[W-56,H-56,-1,-1]].forEach(([x,y,sx,sy])=>{
    g.beginPath(); g.moveTo(x + sx*C, y); g.lineTo(x, y); g.lineTo(x, y + sy*C); g.stroke();
  });

  g.textAlign = "left"; g.textBaseline = "alphabetic";

  // 顶部标识
  g.fillStyle = "rgba(143,196,212,.82)";
  g.font = '400 19px "Noto Sans SC", sans-serif';
  drawSpaced(g, "三 体 · 同 人 互 动 小 说", W/2, 148, 8);
  g.fillStyle = "rgba(201,185,138,.55)";
  g.fillRect(W/2 - 46, 176, 92, 1);

  // 结局达成
  g.fillStyle = "rgba(201,185,138,.92)";
  g.font = '400 24px "Noto Sans SC", sans-serif';
  drawSpaced(g, "结  局  达  成", W/2, 352, 12);

  // 结局名（带冷光）
  const name = achEndingName(s);
  g.save();
  g.textAlign = "center";
  g.shadowColor = "rgba(120,200,226,.45)"; g.shadowBlur = 34;
  g.fillStyle = "#EDF4F8";
  g.font = `900 ${name.length >= 6 ? 78 : (name.length <= 4 ? 104 : 92)}px "Noto Serif SC", serif`;
  g.fillText(name, W/2, 478);
  g.shadowBlur = 0;
  g.restore();

  // 角色线
  g.fillStyle = "rgba(160,182,194,.88)";
  g.font = '400 26px "Noto Sans SC", sans-serif';
  drawSpaced(g, `角色 · ${achRole(sceneId)}`, W/2, 546, 3);

  // 分隔线
  g.strokeStyle = "rgba(201,185,138,.28)"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(W*.28, 606); g.lineTo(W*.72, 606); g.stroke();

  // 达成者
  g.fillStyle = "rgba(126,143,154,.9)";
  g.font = '300 20px "Noto Sans SC", sans-serif';
  drawSpaced(g, "达 成 者", W/2, 690, 7);
  const nick = (AUTH.user && AUTH.user.username) ? AUTH.user.username : "游客";
  g.textAlign = "center";
  g.fillStyle = "#8FC4D4";
  g.font = '700 48px "Noto Serif SC", serif';
  g.fillText(nick.length > 12 ? nick.slice(0, 12) + "…" : nick, W/2, 762);

  // 收集进度
  let done = 0;
  try{ done = (JSON.parse(localStorage.getItem(ENDINGS_KEY) || "[]") || []).length; }catch(e){}
  const totalEndings = Object.values(STORY).filter(n => !n.choices || n.choices.length === 0).length;
  g.fillStyle = "rgba(150,168,180,.8)";
  g.font = '300 22px "Noto Sans SC", sans-serif';
  drawSpaced(g, `已收集结局 ${done} / ${totalEndings}`, W/2, 846, 3);

  // 结尾原句（取正文最后一行）
  const quoteRaw = String(s.text || "").split("\n").map(x => x.trim()).filter(Boolean).pop() || "";
  if(quoteRaw){
    const q = quoteRaw.length > 24 ? quoteRaw.slice(0, 24) + "…" : quoteRaw;
    g.save();
    g.textAlign = "center";
    g.fillStyle = "rgba(210,224,232,.72)";
    g.font = '400 30px "Noto Serif SC", serif';
    g.fillText("「" + q + "」", W/2, 952);
    g.restore();

  g.save();
  g.textAlign = "center";
  g.fillStyle = "rgba(143,196,212,.055)";
  g.font = '900 120px "Noto Serif SC", serif';
  g.fillText("面壁", W/2, 1130);
  g.restore();

  g.fillStyle = "rgba(201,185,138,.5)";
  g.font = '400 22px "Noto Serif SC", serif';
  drawSpaced(g, "思 想 即 是 战 场", W/2, 1214, 8);

  // 页脚：日期 + 域名
  const d = new Date();
  const ds = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
  g.textAlign = "center";
  g.fillStyle = "rgba(150,168,180,.85)";
  g.font = '300 20px "Noto Sans SC", sans-serif';
  g.fillText(ds, W/2, 1292);
  g.fillStyle = "rgba(128,148,160,.8)";
  g.font = '300 17px "Noto Sans SC", sans-serif';
  drawSpaced(g, "andymagicpromax.github.io/santi-faces", W/2, 1330, 1.5);

  return cv.toDataURL("image/png");
}
async function buildAchCard(sceneId, s){
  const slot = document.getElementById("achSlot");

  try{
    const url = await makeAchievementCard(sceneId, s);

/* ============================================================
   成就分享海报（3:4，1080×1440）
   结构沿用结局成就卡：上方「成就达成」→ 成就名 → 立绘 → 达成者 → 日期，
   另加成就背景线稿与右下角网站二维码，方便直接发朋友圈 / 小红书。
   ============================================================ */
const IMG_CACHE = new Map();          // 已加载的图片
const LINEART_CACHE = new Map();      // 去白底后的成就线稿
function loadImage(src){
  if(IMG_CACHE.has(src)) return IMG_CACHE.get(src);
  const p = new Promise((res, rej)=>{
    const im = new Image();
    im.onload = ()=>res(im);
    im.onerror = ()=>rej(new Error("图片加载失败：" + src));
    im.src = src;
  });
  IMG_CACHE.set(src, p);
  return p;
}
/* 成就背景图是白底线稿：把亮度当不透明度，白底剪掉，只留细线与色块 */
function lineArtCanvas(src, w, h){
  const key = src + "@" + w + "x" + h;
  if(LINEART_CACHE.has(key)) return LINEART_CACHE.get(key);
  const p = (async()=>{
    const img = await loadImage(src);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const x = c.getContext("2d");
    x.drawImage(img, 0, 0, w, h);
    const d = x.getImageData(0, 0, w, h), px = d.data;
    for(let i = 0; i < px.length; i += 4){
      const lum = px[i]*.299 + px[i+1]*.587 + px[i+2]*.114;
      px[i+3] = lum <= 12 ? 0 : Math.min(255, lum * 1.2);
    }
    x.putImageData(d, 0, 0);
    return c;
  })();
  LINEART_CACHE.set(key, p);
  return p;
}
function achPosterTime(a){
  const times = endTimesMap();
  let ids = [];
  if(a.final){
    ids = allEndingIds();
  }else{
    const r = ROLES.find(x=>x.id === a.roleId);
    if(r) ids = roleEndings(r);
  }
  let ts = 0;
  ids.forEach(id=>{ const t = Number(times[id] || 0); if(t > ts) ts = t; });
  return ts || Date.now();
}
function fmtDate(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
}
/* 立绘底部渐隐，避免人头被硬切 */
function fadedPortrait(img, size){
  const c = document.createElement("canvas");
  c.width = size; c.height = size;
  const x = c.getContext("2d");
  x.drawImage(img, 0, 0, size, size);
  const gr = x.createLinearGradient(0, size*.62, 0, size);
  gr.addColorStop(0, "rgba(0,0,0,0)");
  gr.addColorStop(1, "rgba(0,0,0,1)");
  x.globalCompositeOperation = "destination-out";
  x.fillStyle = gr;
  x.fillRect(0, size*.62, size, size*.38);
  return c;
}

/* —— 面板开合 —— */
let saveAnchorEl = null, savePinned = false, saveCloseTimer = null, saveHideTimer = null, saveAnimTimer = null, saveMsg = "", saveMsgTimer = null;
function cancelSaveHide(){ clearTimeout(saveHideTimer); saveHideTimer = null; }
function openSavePanel(anchor, pin){
  const stage = document.getElementById("saveStage");
  const panel = document.getElementById("savePanel");
  if(!stage || !panel) return;
  if(anchor) saveAnchorEl = anchor;
  if(pin) savePinned = true;   // 只有点击才钉住，悬停只是临时展开
  cancelSaveClose();
  cancelSaveHide();
  stage.hidden = false;
  panel.classList.remove("is-closing");
  document.querySelectorAll(".save-tab,.save-open").forEach(el=>el.classList.remove("is-open"));
  if(saveAnchorEl && saveAnchorEl.classList) saveAnchorEl.classList.add("is-open");
  renderSavePanel();
  positionSavePanel();
  /* 重放一次「展开」特效：先摘掉类名并强制回流，否则连续展开时动画不会重播 */
  panel.classList.remove("is-opening");
  void panel.offsetWidth;
  panel.classList.add("is-opening");
  clearTimeout(saveAnimTimer);
  saveAnimTimer = setTimeout(function(){ panel.classList.remove("is-opening"); }, 600);  // 兜底：动画事件漏掉也能恢复常态
}
/* 点一下「存档」键：开着就收起，关着就钉住展开 */
function toggleSavePanel(anchor){
  const stage = document.getElementById("saveStage");
  if(stage && !stage.hidden && saveAnchorEl === anchor){ closeSavePanel(); return; }
  openSavePanel(anchor, true);
}
function closeSavePanel(instant){
  cancelSaveClose();
  const stage = document.getElementById("saveStage");
  const panel = document.getElementById("savePanel");
  document.querySelectorAll(".save-tab,.save-open").forEach(el=>el.classList.remove("is-open"));
  savePinned = false;
  saveMsg = "";
  if(!stage) return;
  if(instant || !panel || stage.hidden){
    cancelSaveHide();
    stage.hidden = true;
    if(panel){ panel.classList.remove("is-opening", "is-closing"); }
    return;
  }
  /* 正常收起：先播收束动画，播完再真正隐藏 */
  panel.classList.remove("is-opening");
  panel.classList.add("is-closing");
  cancelSaveHide();
  saveHideTimer = setTimeout(function(){
    stage.hidden = true;
    panel.classList.remove("is-closing");
    saveHideTimer = null;
  }, 230);
}
function scheduleSaveClose(){
  /* 悬停展开时，指针离开「存档」键和面板后收起；点击钉住的则不动 */
  if(savePinned) return;
  clearTimeout(saveCloseTimer);
  saveCloseTimer = setTimeout(closeSavePanel, 300);
}
function cancelSaveClose(){ clearTimeout(saveCloseTimer); }

/* 面板本身也参与悬停判断：指针从「存档」键挪进面板时，这 300ms 内不会被收掉；
   面板整层遮罩不再拦截指针，所以离开按键是真的离开，不会再来回闪。 */
(function(){
  const panel = document.getElementById("savePanel");
  if(!panel) return;
  panel.addEventListener("mouseenter", cancelSaveClose);
  panel.addEventListener("mouseleave", function(){ if(!savePinned) scheduleSaveClose(); });
  /* 展开动画播完就摘掉类名，之后再刷新面板内容不会重播 */
  panel.addEventListener("animationend", function(e){
    if(e.target === panel && e.animationName === "savePanelIn") panel.classList.remove("is-opening");
  });
})();

/* 面板贴着触发键：首页的「存档」键在按钮组下方，优先向上展开，不去挡开始游戏；
   剧情页的「存档」键在正文右上，优先向下展开。放不下再翻向另一边，并夹在视口里。 */
function positionSavePanel(){
  const panel = document.getElementById("savePanel");
  const a = saveAnchorEl;
  if(!panel || !a || !a.getBoundingClientRect) return;
  const r = a.getBoundingClientRect();
  const pw = panel.offsetWidth, ph = panel.offsetHeight;
  if(!pw || !ph) return;
  let left = r.left + r.width/2 - pw/2;
  left = Math.max(12, Math.min(left, window.innerWidth - pw - 12));

  const preferUp = !!(a.classList && a.classList.contains("save-tab"));
  let top = preferUp ? r.top - ph - 10 : r.bottom + 10;
  if(preferUp && top < 12) top = r.bottom + 10;
  if(!preferUp && top + ph > window.innerHeight - 12) top = r.top - ph - 10;
  top = Math.max(12, Math.min(top, window.innerHeight - ph - 12));

  panel.style.left = left + "px";
  panel.style.top = top + "px";
  /* 动画从贴着触发键的那一侧长出来：首页向上展开→原点在底边；剧情页向下展开→原点在顶边 */
  panel.style.transformOrigin = preferUp && top + ph <= r.top ? "50% 100%" : "50% 0%";
}

function renderSavePanel(){

/* 面板内按钮：读取 / 存入（覆盖需二次确认）/ 删除（二次确认） */
function saveAct(kind, slotId, el){
  const slot = SAVE_SLOTS.find(s=>s.id === slotId);
  if(!slot) return;

  if(kind === "load"){
    const e = savesRead()[slotId];
    if(!e || !STORY[e.node]) return;
    closeSavePanel(true);       // 读档要立刻走，别等收束动画
    storyHist = [e.node];       // 读档即从这里重新起算「上一章」，不混进读档前的路径
    const target = "#story/" + e.node;
    if(location.hash === target) router(); else location.hash = target;
    return;
  }

  if(kind === "save"){
    if(!inStoryPage()) return;
    if(!canSave()){ toastMsg("游客模式不能保存进度，请先注册或登录"); return; }
    const exist = savesRead()[slotId];
    if(el && exist && el.dataset.wait !== "1"){
      el.dataset.wait = "1"; el.textContent = "确认覆盖";
      setTimeout(()=>{ if(el.isConnected){ el.dataset.wait = ""; el.textContent = "覆盖"; } }, 2600);
      return;
    }
    const node = location.hash.split("/")[1];
    writeSave(slotId, node, "manual");
    flashSaveMsg("已存入「" + slot.label + "」· " + roleOfNode(node));
    renderSavePanel(); positionSavePanel(); refreshSaveTab();
    return;
  }

  if(kind === "del"){
    const all = savesRead();
    if(el && all[slotId] && el.dataset.wait !== "1"){
      el.dataset.wait = "1"; el.textContent = "确认删除";
      setTimeout(()=>{ if(el.isConnected){ el.dataset.wait = ""; el.textContent = "删除"; } }, 2600);
      return;
    }
    delete all[slotId];
    savesWrite(all);
    flashSaveMsg("已删除「" + slot.label + "」");
    renderSavePanel(); positionSavePanel(); refreshSaveTab();
    return;
  }
}
function flashSaveMsg(text){
  saveMsg = text;
  clearTimeout(saveMsgTimer);
  saveMsgTimer = setTimeout(()=>{ saveMsg = ""; renderSavePanel(); }, 3000);
}

/* 点面板外面 / 按 Esc 收起。

/* —— Supabase 请求 —— */
async function sbFetch(path, opt){
  opt = opt || {};
  const headers = Object.assign({ "apikey": SB_KEY, "Content-Type": "application/json" }, opt.headers || {});
  headers.Authorization = "Bearer " + (opt.token || SB_KEY);
  const res = await fetch(SB_URL + path, {
    method: opt.method || "GET",
    headers: headers,
    body: opt.body != null ? JSON.stringify(opt.body) : undefined
  });
  const txt = await res.text();
  let data = null;
  if(txt){ try{ data = JSON.parse(txt); }catch(e){ data = txt; } }
  if(!res.ok){
    const msg = (data && (data.message || data.msg || data.error_description || data.error)) || ("请求失败 HTTP " + res.status);
    const err = new Error(msg);
    err.status = res.status; err.data = data;
    throw err;
  }
  return data;
}
function applySession(t){
  AUTH.access = t.access_token;
  AUTH.refresh = t.refresh_token;
  AUTH.expiresAt = Date.now() + ((t.expires_in || 3600) * 1000);
  saveAuth(AUTH);
}
async function sbRefresh(){
  if(!AUTH || !AUTH.refresh) return false;
  try{
    const t = await sbFetch("/auth/v1/token?grant_type=refresh_token", {
      method:"POST", body:{ refresh_token: AUTH.refresh }
    });
    applySession(t);
    return true;
  }catch(e){ return false; }
}
async function ensureToken(){
  if(!AUTH || AUTH.mode === "guest" || !AUTH.access) return null;
  if(Date.now() > (AUTH.expiresAt || 0) - 120000){
    const ok = await sbRefresh();
    if(!ok) return null;
  }
  return AUTH.access;
}
async function sbProfile(uid){
  const rows = await sbFetch("/rest/v1/profiles?select=id,username,role,created_at&id=eq." + encodeURIComponent(uid), { token: await ensureToken() });
  return (rows && rows[0]) || null;
}
async function sbSignUp(username, password){
  return sbFetch("/auth/v1/signup", {
    method:"POST",
    body:{ email: emailFor(username), password: password, data:{ username: username } }
  });
}
async function sbSignIn(username, password){
  return sbFetch("/auth/v1/token?grant_type=password", {
    method:"POST",
    body:{ email: emailFor(username), password: password }
  });
}

function canSave(){ return !!(AUTH && AUTH.user && (AUTH.mode === "account" || AUTH.mode === "admin")); }

/* —— 云端进度：整体同步 —— */
function collectProgress(){
  const readArr = k=>{ try{ return JSON.parse(localStorage.getItem(k) || "[]"); }catch(e){ return []; } };
  return {
    v: 1,
    saves: savesRead(),
    endings: readArr(ENDINGS_KEY),
    ach: readArr(ACH_SEEN_KEY),
    node: currentStoryId || null,
    name: AUTH && AUTH.user ? AUTH.user.username : ""
  };
}
function clearLocalProgress(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  try{ localStorage.removeItem(ENDINGS_KEY); }catch(e){}
  try{ localStorage.removeItem(ACH_SEEN_KEY); }catch(e){}
}
function applyCloudProgress(row){
  if(!row || !row.data || typeof row.data !== "object") return false;
  const d = row.data;
  let filled = false;
  if(d.saves && typeof d.saves === "object"){ localStorage.setItem(SAVE_KEY, JSON.stringify(d.saves)); filled = true; }
  if(Array.isArray(d.endings) && d.endings.length){ localStorage.setItem(ENDINGS_KEY, JSON.stringify(d.endings)); filled = true; }
  if(Array.isArray(d.ach) && d.ach.length){ localStorage.setItem(ACH_SEEN_KEY, JSON.stringify(d.ach)); filled = true; }
  return filled;
}
async function sbLoadProgress(uid){
  const rows = await sbFetch("/rest/v1/progress?select=data,updated_at&user_id=eq." + encodeURIComponent(uid), { token: await ensureToken() });
  return (rows && rows[0]) || null;
}
async function sbSaveProgress(){
  if(!canSave()) return;
  const token = await ensureToken();
  if(!token) return;
  await sbFetch("/rest/v1/progress", {
    method:"POST",
    token: token,
    headers:{ "Prefer": "resolution=merge-duplicates,return=minimal" },
    body:{ user_id: AUTH.user.id, data: collectProgress(), updated_at: new Date().toISOString() }
  });
}
let cloudTimer = 0, cloudFail = 0;
function cloudTouch(){
  if(!canSave()) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(()=>{
    sbSaveProgress().then(()=>{ cloudFail = 0; }).catch(()=>{
      cloudFail++;
      if(cloudFail === 1) toastMsg("云端同步暂时失败，进度已存在本机，会自动重试");
      if(cloudFail < 5) cloudTouch();
    });
  }, 700);
}

function setAuthMsg(text, ok){
  const el = document.getElementById("authMsg");
  if(!el) return;
  el.textContent = text || "";
  el.classList.toggle("ok", !!ok);
}
function friendlyAuthError(err, mode){
  const m = String((err && err.message) || "");
  if(/Invalid login credentials/i.test(m)) return "用户名或密码不正确";
  if(/username taken|already registered|already exists|User already exists|Database error saving new user|duplicate key/i.test(m)) return "该用户名已被占用";
  if(/Email not confirmed/i.test(m)) return "账号还需要邮箱验证，请联系管理员开启自动确认";
  if(/Password should be|password.*6/i.test(m)) return "密码不符合要求，至少 6 位";
  if(/signups? not allowed|disabled/i.test(m)) return "当前已关闭注册，请稍后再试";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return "连不上服务器，请检查网络后重试";
  if(/rate limit|too many/i.test(m)) return "操作太频繁，稍等一分钟再试";
  return m || (mode === "register" ? "注册失败，请稍后重试" : "登录失败，请稍后重试");
}
async function doAuthSubmit(e){
  e.preventDefault();
  if(authBusy) return;
  const userEl = document.getElementById("auUser"), passEl = document.getElementById("auPass");
  const pass2El = document.getElementById("auPass2");
  const username = (userEl ? userEl.value : "").trim();
  const password = passEl ? passEl.value : "";
  const btn = document.getElementById("authGo");
  const fail = m=>{ setAuthMsg(m, false); };
  if(username.length < 2) return fail("用户名至少 2 个字符");
  if(!/^[\u4e00-\u9fa5A-Za-z0-9_\-]{2,24}$/.test(username)) return fail("用户名只能用中文、字母、数字、下划线，2–24 个字符");
  if(password.length < 6) return fail("密码至少 6 位");
  if(authMode === "register" && (!pass2El || pass2El.value !== password)) return fail("两次输入的密码不一致，请重新确认");

  authBusy = true;
  setAuthMsg(authMode === "register" ? "正在创建账号…" : "正在验证身份…", true);
  if(btn){ btn.disabled = true; btn.textContent = authMode === "register" ? "创建中…" : "验证中…"; }

  try{
    if(authMode === "register"){
      const taken = await sbFetch("/rest/v1/rpc/username_taken", { method:"POST", body:{ p_name: username } }).catch(()=>null);
      if(taken === true){ setAuthMsg("该用户名已被占用", false); return; }
      const t = await sbSignUp(username, password);
      if(!t || !t.access_token) throw new Error("username taken");
      AUTH = { mode:"account", access:t.access_token, refresh:t.refresh_token, expiresAt: Date.now() + ((t.expires_in || 3600) * 1000), user:{ id:t.user.id, username:username, role:"player", created_at:t.user.created_at } };
      saveAuth(AUTH);
      const prof = await sbProfile(t.user.id).catch(()=>null);
      if(prof){ AUTH.user.role = prof.role || "player"; AUTH.user.username = prof.username || username; AUTH.user.created_at = prof.created_at; saveAuth(AUTH); }
      await enterGame(true);
      return;
    }
    const t = await sbSignIn(username, password);
    AUTH = { mode: authMode === "admin" ? "admin" : "account", access:t.access_token, refresh:t.refresh_token, expiresAt: Date.now() + ((t.expires_in || 3600) * 1000), user:{ id:t.user.id, username:username, role:"player" } };
    saveAuth(AUTH);
    let prof = null;
    try{ prof = await sbProfile(t.user.id); }catch(e2){}
    if(prof){ AUTH.user.role = prof.role || "player"; AUTH.user.username = prof.username || username; AUTH.user.created_at = prof.created_at; saveAuth(AUTH); }
    if(authMode === "admin" && AUTH.user.role !== "admin"){
      AUTH = null; saveAuth(null);
      setAuthMsg("这个账号还不是管理员。请先在 Supabase SQL Editor 执行：" + ADMIN_SQL_HINT, false);
      return;
    }
    await enterGame(false);
  }catch(err){
    if(AUTH && AUTH.user && !AUTH.user.role) AUTH = null;
    saveAuth(AUTH && AUTH.mode === "guest" ? AUTH : null);
    AUTH = null;
    saveAuth(null);
    fail(friendlyAuthError(err, authMode));
  }finally{
    authBusy = false;
    if(btn){ btn.disabled = false; btn.textContent = authMode === "register" ? "注 册" : "登 录"; }
  }
}

function autoGrow(el){
  if(!el || el.tagName !== "TEXTAREA") return;
  const fit = ()=>{
    el.style.height = "auto";
    const h = Math.min(el.scrollHeight, 110);
    el.style.height = h + "px";
    el.style.overflowY = el.scrollHeight > 110 ? "auto" : "hidden";
  };
  el.addEventListener("input", fit);
  fit();
}
/* Enter 发送，Shift+Enter 换行（中文输入法选词时不会误发） */
function bindEnterSend(el, onSend){
  if(!el) return;
  el.addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    if(e.isComposing) return;
    if(e.shiftKey && el.tagName === "TEXTAREA") return;   // 多行框：Shift+Enter 走默认换行
    e.preventDefault();
    onSend();
  });
}

      <button class="pact" data-act="cmt" data-id="${p.id}">${SVG_BUBBLE}<span>${p.comment_count || 0} 评论</span></button>
      ${canDel ? `<button class="pact danger" data-act="delpost" data-id="${p.id}">删除留言</button>` : ""}
      ${pinBtn}
    </div>
    <div id="cmts-${p.id}"></div>
  </div>`;
}

async function renderBoard(){
  boardShell("board");
  markSeen();                       // 打开交流区即视为已查看，红点清掉
  const body = document.getElementById("boardBody");
  if(!body) return;
  let posts = [], myLikes = new Set();
  try{
    const token = await ensureToken();
    const rows = await sbFetch("/rest/v1/posts?select=id,user_id,username,content,like_count,comment_count,pinned,author_admin,created_at&order=pinned.desc,created_at.desc&limit=50", { token: token });
    posts = rows || [];
    if(token){
      const l = await sbFetch("/rest/v1/post_likes?select=post_id&user_id=eq." + encodeURIComponent(AUTH.user.id), { token: token });
      (l || []).forEach(r=>myLikes.add(String(r.post_id)));
    }
  }catch(e){
    body.innerHTML = `<div class="admin-note">读取留言失败：${escHtml(e.message)}<br>如果提示 relation "public.posts" does not exist，说明交流区建表脚本还没在 Supabase 执行。</div>`;
    return;
  }
  const composer = canPost()
    ? `<div class="board-write">
        <textarea id="postText" maxlength="600" placeholder="写下你的想法…（Enter 发送，Shift+Enter 换行）"></textarea>
        <div class="board-write-foot">
          <span class="board-tip">以「${escHtml(AUTH.user.username)}」的身份发言</span>
          <button class="board-send" id="postSend">发 布</button>
        </div>
      </div>`
    : `<div class="board-write"><div class="board-tip">游客只能浏览。注册或登录后即可留言、点赞和评论。</div></div>`;
  const list = posts.length
    ? posts.map(p=>postHTML(p, myLikes.has(String(p.id)))).join("")
    : `<div class="post-empty">还没有人留言，来写第一条吧。</div>`;
  body.innerHTML = composer + `<div id="postWrap">${list}</div>`;

  body.querySelectorAll("[data-act]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.id, act = btn.dataset.act;
      if(act === "like") toggleLike(id, btn);
      else if(act === "cmt") toggleComments(id);
      else if(act === "delpost") delPost(id);
      else if(act === "pin") togglePin(id, btn.dataset.pin === "1");
    });
  });
  const send = document.getElementById("postSend");
  if(send) send.addEventListener("click", submitPost);
  const taEl = document.getElementById("postText");
  if(taEl) bindEnterSend(taEl, submitPost);
  if(focusPostId){
    const pid = focusPostId, cid = focusCommentId;
    focusPostId = null; focusCommentId = null;
    const el = document.getElementById("post-" + pid);
    if(el) el.scrollIntoView({ block:"center" });
    if(cid){
      const box = document.getElementById("cmts-" + pid);
      if(box){
        box.dataset.open = "1";
        await fillComments(pid, box);
        const row = document.getElementById("cmt-row-" + cid);
        if(row) row.scrollIntoView({ block:"center" });
      }
    }
  }
}

async function toggleLike(postId, btn){
  if(!canPost()){ toastMsg("游客不能点赞，登录后即可"); return; }
  const token = await ensureToken();
  if(!token){ toastMsg("登录状态已过期，请重新登录"); return; }
  const liked = btn.classList.contains("liked");
  try{
    if(liked){
      await sbFetch("/rest/v1/post_likes?post_id=eq." + encodeURIComponent(postId) + "&user_id=eq." + encodeURIComponent(AUTH.user.id), { method:"DELETE", token: token });
    }else{
      await sbFetch("/rest/v1/post_likes", { method:"POST", token: token, headers:{ "Prefer":"return=minimal" },
        body:{ post_id: Number(postId), user_id: AUTH.user.id, username: AUTH.user.username } });
    }
    const y = window.scrollY;
    await renderBoard();

  }catch(e){ toastMsg("点赞失败：" + e.message); }

async function toggleComments(postId){
  const box = document.getElementById("cmts-" + postId);
  if(!box) return;
  if(box.dataset.open === "1"){ box.innerHTML = ""; box.dataset.open = "0"; return; }
  box.dataset.open = "1";
  await fillComments(postId, box);
}

async function fillComments(postId, box){
  const token = await ensureToken();
  box.innerHTML = `<div class="comments"><div class="cmt">加载评论…</div></div>`;
  try{
    const rows = await sbFetch("/rest/v1/post_comments?select=id,user_id,username,content,created_at,parent_id,reply_to,like_count,author_admin&post_id=eq." + encodeURIComponent(postId) + "&order=created_at.asc&limit=200", { token: token });
    let myLikes = new Set();
    if(token){
      const l = await sbFetch("/rest/v1/comment_likes?select=comment_id&user_id=eq." + encodeURIComponent(AUTH.user.id), { token: token });
      (l || []).forEach(r=>myLikes.add(String(r.comment_id)));
    }
    const list = (rows || []).map(c=>{
      const liked = myLikes.has(String(c.id));
      const mine = !!(AUTH && AUTH.user && c.user_id === AUTH.user.id);
      const canDel = isAdmin() || mine;
      return `<div class="cmt ${c.parent_id ? "reply" : ""}" id="cmt-row-${c.id}">
        <div class="cmt-body"><b>${escHtml(c.username)}</b>${c.author_admin ? '<span class="role-admin">管理员</span>' : ""}${c.reply_to ? " 回复 <b>" + escHtml(c.reply_to) + "</b>" : ""}${mine ? '<span class="mine">我</span>' : ""}：${escHtml(c.content)}<span class="post-time"> · ${fmtFullTime(c.created_at)}</span></div>
        <div class="cmt-acts">
          <button class="pact small ${liked ? "liked" : ""}" data-clike="${c.id}">${SVG_HEART}<span>${c.like_count || 0}</span></button>
          <button class="pact small" data-creply="${c.id}" data-cname="${escHtml(c.username)}">回复</button>
          ${canDel ? `<span class="del" data-delcmt="${c.id}">删除</span>` : ""}
        </div>
        <div id="replybox-${c.id}"></div>
      </div>`;
    }).join("");
    box.innerHTML = `<div class="comments">
        ${list || `<div class="cmt" style="color:#6f7d87">还没有评论</div>`}
        ${canPost() ? `<div class="cmt-line"><textarea class="cmt-input" id="cmt-${postId}" rows="1" maxlength="300" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea><button class="pact" data-sendcmt="1">发送</button></div>` : ""}
      </div>`;
    const send = box.querySelector("[data-sendcmt]");
    if(send) send.addEventListener("click", ()=>addComment(postId, box, null, ""));
    const cmtInput = box.querySelector("#cmt-" + postId);
    if(cmtInput){ autoGrow(cmtInput); bindEnterSend(cmtInput, ()=>addComment(postId, box, null, "")); }
    box.querySelectorAll("[data-delcmt]").forEach(el=>{
      el.addEventListener("click", ()=>delComment(el.dataset.delcmt, postId, box));
    });
    box.querySelectorAll("[data-clike]").forEach(el=>{
      el.addEventListener("click", ()=>toggleCommentLike(el.dataset.clike, el, postId, box));
    });
    box.querySelectorAll("[data-creply]").forEach(el=>{
      el.addEventListener("click", ()=>openReply(postId, box, el.dataset.creply, el.dataset.cname || ""));
    });
  }catch(e){
    box.innerHTML = `<div class="comments"><div class="cmt">评论读取失败：${escHtml(e.message)}</div></div>`;
  }
}

/* 点「回复」：在该评论下面展开一个输入框 */
function openReply(postId, box, commentId, name){
  if(!canPost()){ toastMsg("游客不能回复，登录后即可"); return; }
  const wrap = box.querySelector("#replybox-" + commentId);
  if(!wrap) return;
  if(wrap.dataset.open === "1"){ wrap.innerHTML = ""; wrap.dataset.open = "0"; return; }
  wrap.dataset.open = "1";
  wrap.innerHTML = `<div class="reply-line"><textarea class="cmt-input" id="rcmt-${commentId}" rows="1" maxlength="300" placeholder="回复 ${escHtml(name)}…（Enter 发送，Shift+Enter 换行）"></textarea><button class="pact" data-rsend="1">发送</button></div>`;
  const input = wrap.querySelector("#rcmt-" + commentId);
  const btn = wrap.querySelector("[data-rsend]");
  const fire = ()=>{
    const text = ((input && input.value) || "").trim();
    if(!text){ toastMsg("写点什么再发送吧"); return; }
    addComment(postId, box, commentId, name, text);
  };
  if(input) input.focus();
  if(input) autoGrow(input);
  if(btn) btn.addEventListener("click", fire);
  if(input) bindEnterSend(input, fire);
}

async function addComment(postId, box, parentId, replyTo, preset){
  if(!canPost()){ toastMsg("游客不能评论，登录后即可"); return; }
  let text = (preset || "").trim();
  if(!text){
    const input = box.querySelector("#cmt-" + postId);
    text = ((input && input.value) || "").trim();
  }
  if(!text){ toastMsg("写点什么再发送吧"); return; }
  const token = await ensureToken();
  if(!token){ toastMsg("登录状态已过期，请重新登录"); return; }
  try{
    await sbFetch("/rest/v1/post_comments", { method:"POST", token: token, headers:{ "Prefer":"return=minimal" },
      body:{ post_id: Number(postId), user_id: AUTH.user.id, username: AUTH.user.username, content: text,
             parent_id: parentId ? Number(parentId) : null, reply_to: replyTo || "" } });
    const y = window.scrollY;
    await renderBoard();
    window.scrollTo(0, y);
    const nb = document.getElementById("cmts-" + postId);
    if(nb){ nb.dataset.open = "1"; await fillComments(postId, nb); }
  }catch(e){ toastMsg("评论失败：" + e.message); }
}

async function submitPost(){

async function delPost(id){
  if(!canPost()){ toastMsg("请先登录"); return; }
  if(!confirm("删除这条留言？它下面的所有评论也会一起隐藏。")) return;
  try{
    await sbFetch("/rest/v1/rpc/soft_delete_post", { method:"POST", token: await ensureToken(),
      headers:{ "Prefer":"return=minimal" }, body:{ p_id: Number(id) } });
    toastMsg("已删除该留言");
    await renderBoard();
  }catch(e){ toastMsg("删除失败：" + e.message + "（只有留言作者本人或管理员能删）"); }
}
async function delComment(id, postId, box){
  if(!canPost()){ toastMsg("请先登录"); return; }
  if(!confirm("删除这条评论？（别人对它的回复会保留）")) return;
  try{
    await sbFetch("/rest/v1/rpc/soft_delete_comment", { method:"POST", token: await ensureToken(),
      headers:{ "Prefer":"return=minimal" }, body:{ p_id: Number(id) } });

    await renderBoard();

}

/* —— hash 路由：根据网址 # 后面的内容切换页面 —— */
function router(){
  typeSfxStop();   // 离开当前页时，把还在响的打字声收掉
  closeSavePanel(true);// 切页时立刻收起存档面板
  /* 没有登录态：无论如何都先看登录页，且登录页不放 BGM */
  if(!AUTH){
    document.body.classList.add("auth-mode");
    renderLogin();
    if(location.hash !== "#login") setHashSafe("#login");
    window.scrollTo(0,0);
    return;
  }
  document.body.classList.remove("auth-mode");
  const hash = location.hash.replace(/^#/,"");
  if(!hash.startsWith("story/")){ currentStoryId = null; storyHist = []; }
  document.body.classList.toggle("kg-mode", hash === "archive");
  if(hash.startsWith("story/")){ renderStory(hash.split("/")[1]); }
  else if(hash === "select"){ renderSelect(); }
  else if(hash === "archive"){ renderArchive(); }
  else if(hash === "board"){ renderBoard(); }
  else if(hash === "messages"){ renderMessages(); }
  else if(hash === "admin"){ if(isAdmin()) renderAdmin(); else { setHashSafe("#home"); renderHome(); } }
  else { renderHome(); }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", router);
window.addEventListener("load", router);

/* ===== 背景音乐：自动播放 + 右上角静音开关 / 悬停音量条 ===== */
(function(){
  const bgm = document.getElementById("bgm");
  const btn = document.getElementById("bgm-toggle");
  const vol = document.getElementById("bgm-vol");
  bgm.volume = 0.6;
  const SVG_ON  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const SVG_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><line x1="16" y1="9" x2="21" y2="15"/><line x1="21" y1="9" x2="16" y2="15"/></svg>';
  function paint(){ btn.innerHTML = (bgm.muted || bgm.volume === 0) ? SVG_OFF : SVG_ON; }
  /* 首屏不预载 7MB 音频：先出画面，等浏览器空闲再预热 */
  const BGM_SRC = "assets/bgm.mp3";
  function ensureSrc(){ if(!bgm.getAttribute("src")) bgm.src = BGM_SRC; }
  function tryPlay(){ ensureSrc(); bgm.play().catch(()=>{}); }
  let bgmWarmed = false;
  function warm(){
    if(bgmWarmed) return;
    bgmWarmed = true;
    ensureSrc(); bgm.load(); tryPlay();
  }
  window.santiBgmWarm = warm;     /* 登录页静音，登录成功后由 enterGame 调用一次 */
  window.santiBgmStop = function(){ try{ bgm.pause(); }catch(e){} bgm.removeAttribute("src"); try{ bgm.load(); }catch(e){} bgmWarmed = false; };
  /* 浏览器拦截无声自动播放时，在用户首次点击/按键后解锁播放（仅在已登录状态下） */
  function unlock(){
    if(!AUTH) return;
    warm();
    document.removeEventListener("pointerdown", unlock);
    document.removeEventListener("keydown", unlock);
  }
  document.addEventListener("pointerdown", unlock);
  document.addEventListener("keydown", unlock);
  btn.addEventListener("click", ()=>{
    bgm.muted = !bgm.muted;
    if(!bgm.muted) tryPlay();
    paint();
  });
  vol.addEventListener("input", ()=>{
    bgm.volume = vol.value/100;
    if(bgm.muted && vol.value > 0){ bgm.muted = false; tryPlay(); }
    paint();
  });
  paint();
})();

/* ===== 全站按钮点击音效（assets/click.mp3，音量压低） ===== */
(function(){
  const SFX_VOL = 0.25;          // 想要更小就改这里，0~1
  const pool = [new Audio("assets/click.mp3"), new Audio("assets/click.mp3")];
  pool.forEach(a=>{ a.preload = "auto"; a.volume = SFX_VOL; });
  let idx = 0;
  function playSfx(){
    const a = pool[idx = (idx + 1) % pool.length];
    try{ a.currentTime = 0; a.play().catch(()=>{}); }catch(e){}
  }
  /* 所有可点元素：主要按钮、选项、选角卡、返回、跳过、清空、音量按钮、图谱页按钮，以及任何带 onclick 的元素 */
  const SEL = ".ui-btn,.choice-btn,.skip-btn,.ach-clear,.bgm-btn,.kg-open,.kg-back,.role-card,.back,button,[onclick]";
  document.addEventListener("pointerdown", function(e){
    if(e.pointerType === "mouse" && e.button !== 0) return;
    const t = e.target && e.target.closest ? e.target.closest(SEL) : null;
    if(t) playSfx();
  }, true);
})();
</script>
